<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tidy" />
<meta name="theme-color" content="#f6efe3" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Tidy Tolzmanns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f6efe3;
    --cream-2: #ece2cf;
    --ink: #2d2a26;
    --ink-soft: #6a6258;
    --sage: #7a936c;
    --sage-deep: #4f6648;
    --sage-soft: #e3ead8;
    --terracotta: #c9694b;
    --terracotta-deep: #9c4d33;
    --terracotta-soft: #f3d8cc;
    --gold: #c9a14b;
    --line: #d8cdb4;
    --shadow: 0 4px 14px rgba(60, 50, 30, 0.08);
    --shadow-lg: 0 10px 28px rgba(60, 50, 30, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--ink);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
    line-height: 1.45;
  }
  h1, h2, h3, .serif {
    font-family: 'Fraunces', 'Times New Roman', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select {
    font-family: inherit;
    font-size: 16px;
    width: 100%;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(122, 147, 108, 0.18); }
  textarea { min-height: 64px; resize: vertical; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--ink-soft); font-weight: 600; }
  .field { margin-bottom: 12px; }

  /* ---- App shell ---- */
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 80px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-style: italic; }

  /* ---- Top bar ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { margin: 0; font-size: 24px; color: var(--sage-deep); }
  .brand .sub { font-size: 12px; color: var(--ink-soft); }
  .who-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px 6px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .who-chip .dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }

  /* ---- Tabs ---- */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .tab {
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    text-align: center;
  }
  .tab.active {
    background: var(--sage-soft);
    color: var(--sage-deep);
  }

  /* ---- Cards ---- */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card.feature {
    background: linear-gradient(160deg, #fffdf7 0%, var(--sage-soft) 100%);
    border-color: #cfdcc1;
  }
  .card.pending {
    background: linear-gradient(160deg, #fffdf7 0%, var(--terracotta-soft) 100%);
    border-color: #ecc9b9;
  }
  .card .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .card h2 { margin: 0 0 4px; font-size: 22px; color: var(--ink); }
  .card .picked-by { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .card .note { margin-top: 10px; font-size: 14px; color: var(--ink); font-style: italic; border-left: 3px solid var(--sage); padding-left: 10px; }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    transition: transform 0.06s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--sage); color: #fff; box-shadow: var(--shadow); }
  .btn-primary:hover { background: var(--sage-deep); }
  .btn-secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn-warm { background: var(--terracotta); color: #fff; }
  .btn-ghost { background: transparent; color: var(--sage-deep); }

  /* ---- Person row ---- */
  .people { display: flex; flex-direction: column; gap: 10px; }
  .person-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .person-row.me { border-color: var(--sage); box-shadow: 0 0 0 2px rgba(122,147,108,0.12); }
  .person-row.done { background: var(--sage-soft); border-color: #cfdcc1; }
  .person-row .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
  }
  .person-row .name { font-weight: 600; font-size: 15px; }
  .person-row .meta { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .person-row .status {
    font-size: 13px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .person-row .status.done { background: var(--sage-deep); color: #fff; }
  .person-row .status.pending { background: var(--cream-2); color: var(--ink-soft); }

  /* ---- Avatar colors per person ---- */
  .av-Kara    { background: #e0a55b; }
  .av-Rachel  { background: #7a936c; }
  .av-Ashley  { background: #6e8aa6; }
  .av-Gail    { background: #a87a9b; }

  /* ---- Done form ---- */
  .done-form {
    background: #fffdf7;
    border: 1px dashed var(--sage);
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
  }
  .done-form .row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }

  /* ---- Name picker (first run / switch) ---- */
  .name-picker-wrap {
    position: fixed; inset: 0;
    background: rgba(60, 50, 30, 0.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 20px;
    overflow-y: auto;                 /* tall sheets (past day + completions) scroll instead of clipping */
    -webkit-overflow-scrolling: touch;
  }
  .name-picker {
    background: var(--cream);
    border-radius: 18px;
    padding: 24px 20px;
    width: 100%; max-width: 420px;
    box-shadow: var(--shadow-lg);
    margin: auto;                     /* vertically centers when short, scrolls when tall */
    position: relative;
  }
  .sheet-x {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 16px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
    z-index: 1;
  }
  .sheet-x:active { background: var(--cream-2); }
  .name-picker h2 { margin: 0 0 6px; font-size: 22px; color: var(--sage-deep); text-align: center; }
  .name-picker .sub { font-size: 14px; color: var(--ink-soft); text-align: center; margin-bottom: 18px; }
  .name-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .name-tile {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .name-tile .avatar-big {
    width: 48px; height: 48px; border-radius: 50%;
    margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 18px;
  }
  .name-picker .close {
    display: block; margin: 14px auto 0;
    color: var(--ink-soft); font-size: 13px;
  }

  /* ---- History ---- */
  .streaks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .streak {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .streak .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
  .streak .n { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--sage-deep); line-height: 1; }
  .streak .lbl { font-size: 11px; color: var(--ink-soft); }

  .log-row {
    display: grid; grid-template-columns: 60px 1fr auto; gap: 8px; align-items: center;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .log-row:active { background: var(--cream-2); }
  .log-row .when { font-size: 11px; color: var(--ink-soft); }
  .log-row .what .area { font-size: 14px; font-weight: 600; color: var(--ink); }
  .log-row .what .picker { font-size: 11px; color: var(--ink-soft); }
  .log-row .checks { display: flex; gap: 4px; }
  .log-row .check { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; }
  .log-row .check.off { background: var(--cream-2); color: var(--ink-soft); border: 1px solid var(--line); }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; gap: 8px; }
  .cal-head h3 { margin: 0; font-size: 16px; color: var(--sage-deep); flex: 1; text-align: center; }
  .cal-nav {
    width: 36px; height: 36px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 18px;
    color: var(--sage-deep);
    font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.1s ease;
  }
  .cal-nav:active { background: var(--cream-2); }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cal-dow { font-size: 10px; color: var(--ink-soft); text-align: center; font-weight: 600; padding: 4px 0; }
  .cal-cell {
    aspect-ratio: 1;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    font-size: 10px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .cal-cell.empty { background: transparent; border: none; cursor: default; }
  .cal-cell:not(.empty) { cursor: pointer; transition: background 0.1s ease; }
  .cal-cell:not(.empty):active { background: var(--cream-2); }
  .cal-cell.has-day { background: var(--sage-soft); border-color: #cfdcc1; }
  .cal-cell.has-day:active { background: #d6e1c7; }
  .cal-cell.today { box-shadow: 0 0 0 2px var(--terracotta); }
  .cal-cell.future { background: rgba(255, 255, 255, 0.55); border-style: dashed; }
  .cal-cell.past-empty { background: rgba(255, 255, 255, 0.4); border-style: dashed; border-color: var(--cream-2); }
  .cal-cell.planned { background: var(--terracotta-soft); border-color: #ecc9b9; border-style: solid; }
  .cal-cell.planned:active { background: #e8c4b3; }
  .cal-cell .num { font-weight: 700; color: var(--ink-soft); font-size: 11px; }
  .cal-cell .area { font-size: 9px; color: var(--ink); line-height: 1.15; margin-top: 2px; word-break: break-word; flex: 1; }
  .cal-cell .dots { display: flex; gap: 2px; margin-top: auto; }
  .cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cream-2); }
  .cal-cell .dot.on { background: var(--sage-deep); }

  /* ---- Day editor sheet ---- */
  .day-editor .area-line { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; text-align: center; }
  .day-editor .area-line .area-name { color: var(--ink); font-weight: 600; }
  .edit-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .edit-row.done { background: var(--sage-soft); border-color: #cfdcc1; }
  .edit-row .avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
  .edit-row .name { font-weight: 600; font-size: 15px; }
  .edit-row .meta { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .toggle-btn {
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    min-width: 92px;
  }
  .toggle-btn.on { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .toggle-btn:disabled { opacity: 0.5; }

  /* ---- Day sheet (unified past + future editor) ---- */
  .day-sheet .field { text-align: left; }
  .day-sheet .pred {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .day-sheet .pred .you { color: var(--sage-deep); font-weight: 700; }
  .day-sheet .pred .other { color: var(--terracotta-deep); font-weight: 600; }
  .day-sheet .btn { margin-top: 4px; }
  .day-sheet .danger-btn {
    display: block;
    margin: 12px auto 0;
    color: var(--terracotta-deep);
    font-size: 13px;
    font-weight: 600;
    background: none;
    border: none;
  }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    margin: 14px 0 8px;
    text-align: left;
  }
  .day-sheet .section-label:first-of-type { margin-top: 4px; }
  .picker-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .picker-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  .picker-chip .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .picker-chip.on { border-color: var(--sage); background: var(--sage-soft); box-shadow: 0 0 0 2px rgba(122, 147, 108, 0.18); }
  .picker-chip:active { background: var(--cream-2); }

  /* ---- Daily quote ---- */
  .quote {
    margin: 0 0 14px;
    padding: 12px 16px;
    border-left: 3px solid var(--gold);
    background: rgba(255, 253, 247, 0.6);
    border-radius: 0 12px 12px 0;
  }
  .quote .q { font-family: 'Fraunces', serif; font-style: italic; font-size: 15px; color: var(--ink); line-height: 1.4; }
  .quote .by { font-size: 12px; color: var(--ink-soft); margin-top: 6px; font-weight: 600; }

  /* ---- Catch-up list ---- */
  .catchup-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .catchup-row:active { background: var(--cream-2); }
  .catchup-row .when { font-size: 11px; color: var(--ink-soft); }
  .catchup-row .area { font-size: 14px; font-weight: 600; color: var(--ink); }
  .catchup-row .picker { font-size: 11px; color: var(--ink-soft); }
  .catchup-btn {
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    background: var(--sage);
    color: #fff;
    white-space: nowrap;
  }
  .catchup-btn:disabled { opacity: 0.5; }
  .catchup-more { display: block; margin: 6px auto 0; color: var(--sage-deep); font-size: 13px; font-weight: 600; }

  /* ---- Photos ---- */
  .photo-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .photo-thumb {
    width: 56px; height: 56px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--line);
    background: var(--cream-2);
    cursor: pointer;
    display: block;
  }
  .photo-add {
    width: 56px; height: 56px;
    border-radius: 8px;
    border: 1px dashed var(--sage);
    background: #fffdf7;
    color: var(--sage-deep);
    font-size: 11px; font-weight: 600;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    line-height: 1;
  }
  .photo-add .ic { font-size: 18px; }
  .photo-add:disabled { opacity: 0.5; }
  .person-row .photo-strip, .edit-row .photo-strip { grid-column: 2 / -1; margin-top: 0; }
  .done-form .photo-strip { margin: 0 0 12px; }
  .done-form .photo-thumb { position: relative; }
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(30, 26, 22, 0.94);
    z-index: 400;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
    animation: celebFade 0.2s ease;
  }
  .lightbox img { max-width: 100%; max-height: 78vh; border-radius: 10px; box-shadow: var(--shadow-lg); }
  .lightbox .cap { color: var(--cream); font-size: 13px; margin-top: 12px; text-align: center; }
  .lightbox .danger-btn { color: #f3b8a4; margin-top: 10px; font-size: 13px; font-weight: 600; }
  .lightbox .sheet-x { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px; }
  .log-row .photos-n { font-size: 11px; color: var(--ink-soft); margin-left: 6px; }

  /* ---- Release notes sheet ---- */
  .release-item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; margin-bottom: 12px; text-align: left; }
  .release-item .ic { font-size: 22px; line-height: 1.2; text-align: center; }
  .release-item .t { font-weight: 700; font-size: 15px; color: var(--ink); }
  .release-item .d { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  /* ---- Misc ---- */
  .empty-state { text-align: center; padding: 30px 20px; color: var(--ink-soft); font-style: italic; }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--cream);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
    z-index: 200;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.2s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .row-split { display: flex; gap: 8px; }
  .row-split > * { flex: 1; }

  /* ---- Celebration overlay (cowboy!) ---- */
  .celebration-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(246, 239, 227, 0.96) 0%, rgba(236, 226, 207, 0.94) 60%, rgba(201, 105, 75, 0.32) 100%);
    z-index: 300;
    display: flex; align-items: center; justify-content: center;
    animation: celebFade 0.25s ease;
    overflow: hidden;
    cursor: pointer;
  }
  .celebration-overlay.closing { animation: celebFadeOut 0.35s ease forwards; }
  @keyframes celebFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes celebFadeOut { to { opacity: 0; } }
  .celebration-content {
    text-align: center;
    padding: 0 24px;
    transform: scale(0.7);
    animation: celebPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    user-select: none;
    -webkit-user-select: none;
  }
  @keyframes celebPop { to { transform: scale(1); } }
  .cowboy-scene {
    display: flex; align-items: center; justify-content: center;
    gap: 4px;

function quoteForDay(ymd) {
  const days = Math.round(new Date(ymd + 'T12:00:00Z').getTime() / 86400000);

function nextPicker(prev) {
  if (!prev) return NAMES[0];
  const i = NAMES.indexOf(prev);
  return NAMES[(i + 1) % NAMES.length];

function fmtDay(ymd) {
  // ymd is 'YYYY-MM-DD'
  const [y, m, d] = ymd.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtDayShort(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  const dt = new Date(y, m - 1, d);

}
function esc(s) {

}

const MAX_PHOTOS = 4;
const PHOTO_MAX_PX = 1280;
function photoUrl(path) {

function photosFor(completionId) {

function photoStripHtml(completion, canAdd) {

  if (photos.length === 0 && !canAdd) return '';

  }

    html += `<button class="photo-add" type="button" data-action="add-photo" data-completion-id="${esc(completion.id)}"><span class="ic">📷</span>Add</button>`;
  }
  html += `</div>`;
  return html;
}
// Downscale to PHOTO_MAX_PX on the long edge and re-encode as JPEG so phone photos
// (often 3-5 MB) upload fast on cell and stay small in storage.
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, PHOTO_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('Could not process photo')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read photo')); };
    img.src = url;
  });
}
// Opens the native picker (camera or library on iPhone). Resolves to an array of Files.
function pickPhotos(max) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = max > 1;
    input.style.display = 'none';
    input.onchange = () => { resolve(Array.from(input.files || []).slice(0, max)); input.remove(); };
    document.body.appendChild(input);
    input.click();
  });
}
async function uploadPhotos(completionId, files) {
  const existing = photosFor(completionId).length;
  const room = Math.max(0, MAX_PHOTOS - existing);
  const batch = files.slice(0, room);
  if (files.length > room) toast(`Only ${MAX_PHOTOS} photos per day — kept the first ${room}`);
  let n = 0;
  for (const f of batch) {
    const blob = await resizeImage(f);
    const path = `${completionId}/${Date.now()}-${n}.jpg`;
    const { error: upErr } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (upErr) throw new Error('Upload failed: ' + upErr.message);
    const { error: rowErr } = await sb.from('tt_photo').insert({ completion_id: completionId, path });
    if (rowErr) throw new Error('Could not save photo: ' + rowErr.message);
    n++;
  }
  return n;
}

// ============== Data loaders ==============
async function loadToday() {
  state.todayDate = todayCT();
  // Filter to rows up to today; pre-scheduled future rows must not shadow today's logic.
  const { data: dayRows, error: e1 } = await sb
    .from('tt_day')
    .select('*')
    .lte('day_date', state.todayDate)
    .order('day_date', { ascending: false })
    .limit(1);
  if (e1) throw e1;

  const latest = dayRows && dayRows[0];

  if (latest && latest.day_date === state.todayDate) {
    const { data: comps, error: e2 } = await sb
      .from('tt_completion')
      .select('*')
      .eq('day_id', latest.id);
    if (e2) throw e2;
    state.today = { day: latest, completions: comps || [] };
    state.pendingPicker = null;
  } else {
    state.today = null;
    state.pendingPicker = latest ? nextPicker(latest.picker) : NAMES[0];
  }
}

async function loadRecent(days = 2000) {
  // Loads ALL tt_day rows (limit is just a safety ceiling). The calendar can navigate
  // to any past or future month, and we want the data already in memory.
  const { data: dayRows, error: e1 } = await sb
    .from('tt_day')
    .select('*')
    .order('day_date', { ascending: false })
    .limit(days);
  if (e1) throw e1;
  state.recentDays = dayRows || [];

  if (state.recentDays.length === 0) {
    state.recentCompletions = [];
    return;
  }
  const ids = state.recentDays.map(d => d.id);
  const { data: comps, error: e2 } = await sb
    .from('tt_completion')
    .select('*')
    .in('day_id', ids);
  if (e2) throw e2;
  state.recentCompletions = comps || [];

  // Photos: whole table (small), avoids a long .in() URL as history grows.
  const { data: photos, error: e3 } = await sb
    .from('tt_photo')
    .select('*')
    .order('created_at', { ascending: true })
    .limit(5000);
  if (e3) throw e3;
  state.recentPhotos = photos || [];
}

  const payload = {
    day_id: state.today.day.id,
    user_name: state.who,
    note: note && note.trim() ? note.trim() : null,
    minutes_spent: minutes && minutes > 0 ? minutes : null,
  };
  const { data: row, error } = await sb.from('tt_completion').insert(payload).select().single();
  if (error) {
    if (error.code === '23505') {
      toast('Already marked done!');
    } else {
      toast('Could not save: ' + error.message);
    }
    await refresh();
    return;
  }
  // Photos staged in the form upload after the completion row exists. A failed upload
  // still leaves the completion in place — she can retry from the person row.
  if (state.pendingDonePhotos.length > 0) {
    const btn = document.querySelector('[data-action="done"]');
    if (btn) btn.textContent = 'Uploading photos…';
    try { await uploadPhotos(row.id, state.pendingDonePhotos); }
    catch (e) { toast(e.message); }
    state.pendingDonePhotos = [];
  }
  await refresh();
  celebrate(state.who);
}

// One-tap catch-up: mark `who` done for a past day. No celebration (that's for today).
async function catchUp(dayId) {
  const { error } = await sb.from('tt_completion').insert({ day_id: dayId, user_name: state.who });
  if (error && error.code !== '23505') { toast('Could not save: ' + error.message); return; }
  await refresh();
  const day = state.recentDays.find(d => d.id === dayId);
  toast(`Caught up: ${day ? day.area : 'done'} ✓`);
}

// Days before today with an area set where `name` has no completion, newest first.
function catchupDays(name) {
  const doneDayIds = new Set(state.recentCompletions.filter(c => c.user_name === name).map(c => c.day_id));
  return state.recentDays.filter(d => d.day_date < state.todayDate && !doneDayIds.has(d.id));
}

function renderCatchup() {
  const days = catchupDays(state.who);
  if (days.length === 0) return '';
  const LIMIT = 5;
  const shown = state.catchupExpanded ? days : days.slice(0, LIMIT);
  let html = `<div class="card" style="padding: 12px 14px; margin-top: 14px;">
    <div class="label" style="margin-bottom: 8px;">Catch up · ${days.length} behind</div>`;
  for (const d of shown) {
    html += `
      <div class="catchup-row" data-action="open-day" data-ymd="${esc(d.day_date)}" data-day-id="${esc(d.id)}">
        <div>
          <div class="when">${esc(fmtDay(d.day_date))}</div>
          <div class="area">${esc(d.area)}</div>

        </div>
        <button class="catchup-btn" type="button" data-action="catchup-done" data-day-id="${esc(d.id)}">Done ✓</button>
      </div>

  if (days.length > LIMIT) {
    html += `<button class="catchup-more" type="button" data-action="catchup-toggle">${state.catchupExpanded ? 'Show fewer' : `Show ${days.length - LIMIT} more`}</button>`;
  }
  html += `</div>`;
  return html;
}

async function refresh() {
  await Promise.all([loadToday(), loadRecent()]);
  render();
}

// ============== Streak calc ==============
function computeStreak(name) {
  // Walk recentDays (desc). For each day, check if `name` has a completion.
  // Streak = count of consecutive days from the most recent day with a completion downward.
  // If today's row doesn't exist yet but yesterday's does, we start counting at yesterday.
  if (state.recentDays.length === 0) return 0;
  const compsByDay = {};
  for (const c of state.recentCompletions) {
    if (!compsByDay[c.day_id]) compsByDay[c.day_id] = new Set();
    compsByDay[c.day_id].add(c.user_name);
  }
  let streak = 0;
  for (const day of state.recentDays) {
    if (day.day_date > state.todayDate) continue; // ignore pre-scheduled future rows
    const set = compsByDay[day.id] || new Set();
    if (set.has(name)) {
      streak++;
    } else if (day.day_date === state.todayDate) {
      // Today's not over — don't reset the streak just because she hasn't logged yet.
      // It only counts as a miss once the day rolls past.
      continue;
    } else {
      break;
    }
  }
  return streak;
}

function predictPicker(ymd) {
  // Predict whose turn `ymd` falls on, assuming one rotation step per calendar day.
  // Prefer walking forward from the latest prior row; fall back to walking backward
  // from the earliest later row (for backfilling dates before the app existed).
  const targetDate = new Date(ymd + 'T12:00:00');
  const prior = state.recentDays.filter(r => r.day_date < ymd);
  if (prior.length > 0) {
    prior.sort((a, b) => a.day_date < b.day_date ? 1 : -1);
    const latest = prior[0];
    const dayDiff = Math.round((targetDate - new Date(latest.day_date + 'T12:00:00')) / (24 * 3600 * 1000));
    const startIdx = NAMES.indexOf(latest.picker);
    return NAMES[(startIdx + dayDiff) % NAMES.length];
  }
  const later = state.recentDays.filter(r => r.day_date > ymd);
  if (later.length > 0) {
    later.sort((a, b) => a.day_date < b.day_date ? -1 : 1);
    const earliest = later[0];
    const dayDiff = Math.round((new Date(earliest.day_date + 'T12:00:00') - targetDate) / (24 * 3600 * 1000));
    const startIdx = NAMES.indexOf(earliest.picker);
    return NAMES[((startIdx - dayDiff) % NAMES.length + NAMES.length) % NAMES.length];
  }
  return NAMES[0];
}

function renderHistory() {
  // Streaks
  let html = `<div class="streaks">`;
  for (const name of NAMES) {
    const s = computeStreak(name);
    html += `
      <div class="streak">
        <span class="avatar av-${name}">${avatarChar(name)}</span>
        <div>
          <div><span class="n">${s}</span> <span class="lbl">day${s===1?'':'s'} streak</span></div>
          <div class="lbl">${esc(name)}</div>
        </div>
      </div>
    `;
  }
  html += `</div>`;

  // Last 14 days log
  html += `<div class="card" style="padding: 12px 14px;">
    <div class="label" style="margin-bottom: 8px;">Last 14 days</div>`;
  const recent14 = state.recentDays.filter(d => d.day_date <= state.todayDate).slice(0, 14);
  if (recent14.length === 0) {
    html += `<div class="empty-state" style="padding: 14px;">No history yet. Pick today's area to get started.</div>`;
  } else {
    const compsByDay = {};
    for (const c of state.recentCompletions) {
      if (!compsByDay[c.day_id]) compsByDay[c.day_id] = new Set();
      compsByDay[c.day_id].add(c.user_name);
    }
    for (const d of recent14) {
      const done = compsByDay[d.id] || new Set();
      let checks = '';
      for (const name of NAMES) {
        const isOn = done.has(name);
        checks += `<span class="check ${isOn ? '' : 'off'} av-${isOn ? name : ''}" title="${esc(name)}">${avatarChar(name)}</span>`;
      }
      html += `
        <div class="log-row" data-action="open-day" data-ymd="${esc(d.day_date)}" data-day-id="${esc(d.id)}">
          <div class="when">${esc(fmtDayShort(d.day_date))}</div>
          <div class="what">
            <div class="area">${esc(d.area)}</div>
            <div class="picker">picked by ${esc(d.picker)}${(() => {
              const ids = new Set(state.recentCompletions.filter(c => c.day_id === d.id).map(c => c.id));
              const n = state.recentPhotos.filter(p => ids.has(p.completion_id)).length;
              return n ? `<span class="photos-n">📷 ${n}</span>` : '';
            })()}</div>
          </div>
          <div class="checks">${checks}</div>
        </div>
      `;
    }
  }
  html += `</div>`;

  // Calendar (current month)
  html += renderCalendar();

  return html;
}

function renderCalendar() {
  if (state.calYear == null) {
    const tdy = new Date(state.todayDate + 'T12:00:00');
    state.calYear = tdy.getFullYear();
    state.calMonth = tdy.getMonth();
  }
  const year = state.calYear;
  const month = state.calMonth;
  const monthName = new Date(year, month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const byDate = {};
  for (const d of state.recentDays) byDate[d.day_date] = d;
  const compsByDay = {};
  for (const c of state.recentCompletions) {
    if (!compsByDay[c.day_id]) compsByDay[c.day_id] = new Set();
    compsByDay[c.day_id].add(c.user_name);
  }

  let html = `
    <div class="cal-head">
      <button class="cal-nav" data-action="cal-prev" type="button" aria-label="Previous month">‹</button>
      <h3>${esc(monthName)}</h3>
      <button class="cal-nav" data-action="cal-next" type="button" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(x => `<div class="cal-dow">${x}</div>`).join('')}
  `;
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ymd = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayRow = byDate[ymd];
    const isToday = ymd === state.todayDate;
    const isFuture = ymd > state.todayDate;
    let inner = `<div class="num">${d}</div>`;
    if (dayRow) {
      const done = compsByDay[dayRow.id] || new Set();
      inner += `<div class="area">${esc(dayRow.area.slice(0, 14))}</div>`;
      if (!isFuture) {
        let dots = '';
        for (const name of NAMES) dots += `<span class="dot ${done.has(name) ? 'on' : ''}"></span>`;
        inner += `<div class="dots">${dots}</div>`;
      }
    }
    const classes = [];
    if (dayRow && !isFuture) classes.push('has-day');
    if (dayRow && isFuture) classes.push('planned');
    if (!dayRow && isFuture) classes.push('future');
    if (!dayRow && !isFuture && !isToday) classes.push('past-empty');
    if (isToday) classes.push('today');
    let attrs = `data-action="open-day" data-ymd="${esc(ymd)}"`;
    if (dayRow) attrs += ` data-day-id="${esc(dayRow.id)}"`;
    html += `<div class="cal-cell ${classes.join(' ')}" ${attrs}>${inner}</div>`;
  }
  html += `</div>`;
  return html;
}

// ============== Day sheet (unified past + future editor) ==============
function buildDaySheet(ymd, existingRow) {
  const isPast = ymd <= state.todayDate;
  const compsForDay = existingRow
    ? state.recentCompletions.filter(c => c.day_id === existingRow.id)
    : [];
  const compByName = {};
  for (const c of compsForDay) compByName[c.user_name] = c;

  const currentPicker = existingRow ? existingRow.picker : predictPicker(ymd);

  let predHtml = '';
  if (!existingRow) {
    const label = ymd < state.todayDate ? 'Suggested' : 'Predicted';
    predHtml = currentPicker === state.who
      ? `<div class="pred"><span class="you">${label}: your turn ✓</span> — tap a name to change</div>`
      : `<div class="pred">${label}: <span class="other">${esc(currentPicker)}</span> — tap a name to change</div>`;
  }

  let pickerChips = '';
  for (const n of NAMES) {
    pickerChips += `
      <button class="picker-chip ${currentPicker === n ? 'on' : ''}" data-action="set-day-picker" data-picker-name="${esc(n)}" type="button">
        <span class="avatar av-${n}">${avatarChar(n)}</span>
        <span>${esc(n)}</span>
      </button>
    `;
  }

  let toggleSection = '';
  if (existingRow && isPast) {
    let toggleRows = '';
    for (const name of NAMES) {
      const c = compByName[name];
      const done = !!c;
      let meta = '';
      if (done) {
        const parts = [];
        if (c.minutes_spent) parts.push(`${c.minutes_spent} min`);
        if (c.note) parts.push(esc(c.note));
        meta = parts.join(' · ');
      }
      toggleRows += `
        <div class="edit-row ${done ? 'done' : ''}">
          <span class="avatar av-${name}">${avatarChar(name)}</span>
          <div>
            <div class="name">${esc(name)}</div>
            ${meta ? `<div class="meta">${meta}</div>` : ''}
          </div>
          <button class="toggle-btn ${done ? 'on' : ''}" data-action="toggle-done" data-day-id="${esc(existingRow.id)}" data-name="${esc(name)}" type="button">
            ${done ? '✓ Done' : 'Mark done'}
          </button>
          ${photoStripHtml(c, done)}
        </div>
      `;
    }
    toggleSection = `
      <div class="section-label">Completions</div>
      ${toggleRows}
    `;
  }

  const wrap = document.createElement('div');
  wrap.className = 'name-picker-wrap';
  wrap.innerHTML = `
    <div class="name-picker day-sheet">
      <button class="sheet-x" data-action="close-day-editor" type="button" aria-label="Close">✕</button>
      <h2>${esc(fmtDay(ymd))}</h2>
      ${predHtml}

      <div class="section-label">Assigned to</div>
      <div class="picker-chips">${pickerChips}</div>

      <div class="field">
        <label for="day-area">Area</label>
        <input id="day-area" type="text" placeholder="e.g. master bathroom, pantry shelves" autocomplete="off" value="${esc(existingRow ? existingRow.area : '')}" />
      </div>
      <div class="field">
        <label for="day-note">Note (optional)</label>
        <textarea id="day-note" placeholder="Anything to call out">${esc(existingRow && existingRow.picker_note ? existingRow.picker_note : '')}</textarea>
      </div>

      <button class="btn btn-primary" data-action="save-day" data-ymd="${esc(ymd)}" data-day-id="${esc(existingRow ? existingRow.id : '')}" type="button">${existingRow ? 'Save changes' : 'Save'}</button>

      ${toggleSection}

      <button class="close" data-action="close-day-editor" type="button">Cancel</button>
      ${existingRow ? `<button class="danger-btn" data-action="delete-day" data-day-id="${esc(existingRow.id)}" type="button">Delete this day</button>` : ''}
    </div>
  `;
  wrap.addEventListener('click', (ev) => {
    if (ev.target !== wrap) return; // only react to backdrop clicks
    if (isDaySheetDirty() && !confirm('Discard your changes?')) return;
    closeDayEditor();
  });
  return wrap;
}

function openDaySheet(ymd, existingRow) {
  state.planningDate = ymd;
  state.editingDayId = existingRow ? existingRow.id : null;
  state.daySheetInitial = {
    picker: existingRow ? existingRow.picker : predictPicker(ymd),
    area: existingRow ? existingRow.area : '',
    note: existingRow && existingRow.picker_note ? existingRow.picker_note : '',
  };
  document.querySelectorAll('.name-picker-wrap').forEach(n => n.remove());
  const sheet = buildDaySheet(ymd, existingRow);
  document.body.appendChild(sheet);
  attachHandlers();
}

function isDaySheetDirty() {
  if (!state.daySheetInitial) return false;
  const init = state.daySheetInitial;
  const pickerEl = document.querySelector('.picker-chip.on');
  const currentPicker = pickerEl ? pickerEl.getAttribute('data-picker-name') : null;
  const currentArea = document.getElementById('day-area')?.value ?? '';
  const currentNote = document.getElementById('day-note')?.value ?? '';
  return currentPicker !== init.picker
    || currentArea !== init.area
    || currentNote !== init.note;
}

function closeDayEditor() {
  document.querySelectorAll('.name-picker-wrap').forEach(n => n.remove());
  state.editingDayId = null;
  state.planningDate = null;
  state.daySheetInitial = null;
}

async function saveDay(ymd, dayId, picker, area, note) {
  if (!area.trim()) { toast('Type an area first'); return; }
  if (!NAMES.includes(picker)) { toast('Pick who it’s assigned to'); return; }
  const noteClean = note && note.trim() ? note.trim() : null;
  if (dayId) {
    const { error } = await sb.from('tt_day').update({
      picker,
      area: area.trim(),
      picker_note: noteClean,
    }).eq('id', dayId);
    if (error) { toast('Could not save: ' + error.message); return; }
  } else {
    const { error } = await sb.from('tt_day').insert({
      day_date: ymd,
      area: area.trim(),
      picker,
      picker_note: noteClean,
    });
    if (error) {
      if (error.code === '23505') toast('Someone just claimed this day!');
      else toast('Could not save: ' + error.message);
      return;
    }
  }
  await refresh();
  closeDayEditor();
  toast(dayId ? 'Updated ✨' : 'Saved ✨');
}

async function deleteDay(dayId) {
  if (!confirm('Delete this day? Any completions logged for it will also be removed.')) return;
  await sb.from('tt_completion').delete().eq('day_id', dayId);
  const { error } = await sb.from('tt_day').delete().eq('id', dayId);
  if (error) { toast('Could not delete: ' + error.message); return; }
  await refresh();
  closeDayEditor();
  toast('Deleted');
}

async function togglePersonDone(day_id, name) {
  const existing = state.recentCompletions.find(c => c.day_id === day_id && c.user_name === name);
  const turningOn = !existing;
  if (existing) {
    if (existing.minutes_spent || existing.note) {
      const detail = [];
      if (existing.minutes_spent) detail.push(`${existing.minutes_spent} min`);
      if (existing.note) detail.push(`"${existing.note}"`);
      if (!confirm(`Remove ${name}'s entry (${detail.join(' · ')})? It can't be undone.`)) return;
    }
    const { error } = await sb.from('tt_completion').delete().eq('id', existing.id);
    if (error) { toast('Could not update: ' + error.message); return; }
  } else {
    const { error } = await sb.from('tt_completion').insert({ day_id, user_name: name });
    if (error && error.code !== '23505') { toast('Could not update: ' + error.message); return; }
  }
  await Promise.all([loadToday(), loadRecent()]);
  render();
  // Update toggle button in-place to preserve any in-progress form-field edits in the open sheet
  const btn = document.querySelector(`.toggle-btn[data-day-id="${day_id}"][data-name="${name}"]`);
  if (btn) {
    btn.classList.toggle('on', turningOn);
    btn.textContent = turningOn ? '✓ Done' : 'Mark done';
    btn.disabled = false;
    const row = btn.closest('.edit-row');
    if (row) {
      row.classList.toggle('done', turningOn);
      const meta = row.querySelector('.meta');
      if (meta) meta.remove();
    }
  }
}

// ============== Handlers ==============
function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    el.onclick = async (ev) => {
      ev.preventDefault();
      ev.stopPropagation(); // nested actions (e.g. Done button inside a tappable catch-up row) must not fire the parent
      if (action === 'switch-name') {
        state.showNamePicker = true;
        document.body.appendChild(buildNamePicker(false));
        attachHandlers();
        return;
      }
      if (action === 'close-name-picker') { closeNamePicker(); return; }
      if (action === 'set-name') {
        const name = el.getAttribute('data-name');
        state.who = name;
        localStorage.setItem(WHO_KEY, name);
        closeNamePicker();
        render();
        return;
      }
      if (action === 'tab') {
        state.view = el.getAttribute('data-tab');
        render();
        return;
      }
      if (action === 'pick') {
        const area = document.getElementById('area-input').value;
        const note = document.getElementById('picker-note').value;
        if (!area.trim()) { toast('Type an area first'); return; }
        el.disabled = true; el.textContent = 'Saving…';
        try { await pickTodayArea(area, note); } catch (e) { toast(e.message); }
        return;
      }
      if (action === 'done') {
        const note = document.getElementById('done-note').value;
        const minsRaw = document.getElementById('done-mins').value;
        const mins = minsRaw ? parseInt(minsRaw, 10) : null;
        el.disabled = true; el.textContent = 'Saving…';
        try { await markDone(note, mins); } catch (e) { toast(e.message); }
        return;
      }
      if (action === 'refresh') {
        try { await refresh(); toast('Refreshed'); } catch (e) { toast(e.message); }
        return;
      }
      if (action === 'open-day') {
        const ymd = el.getAttribute('data-ymd');
        const dayId = el.getAttribute('data-day-id') || null;
        const row = dayId ? state.recentDays.find(d => d.id === dayId) : null;
        openDaySheet(ymd, row);
        return;
      }
      if (action === 'set-day-picker') {
        document.querySelectorAll('.picker-chip').forEach(c => c.classList.remove('on'));
        el.classList.add('on');
        return;
      }
      if (action === 'save-day') {
        const ymd = el.getAttribute('data-ymd');
        const dayId = el.getAttribute('data-day-id') || null;
        const pickerEl = document.querySelector('.picker-chip.on');
        const picker = pickerEl ? pickerEl.getAttribute('data-picker-name') : null;
        const area = document.getElementById('day-area').value;
        const note = document.getElementById('day-note').value;
        const originalText = el.textContent;
        el.disabled = true; el.textContent = 'Saving…';
        try { await saveDay(ymd, dayId, picker, area, note); } catch (e) { toast(e.message); }
        if (document.body.contains(el)) { el.disabled = false; el.textContent = originalText; }
        return;
      }
      if (action === 'delete-day') {
        const dayId = el.getAttribute('data-day-id');
        try { await deleteDay(dayId); } catch (e) { toast(e.message); }
        return;
      }
      if (action === 'cal-prev' || action === 'cal-next') {
        const delta = action === 'cal-prev' ? -1 : 1;
        let m = state.calMonth + delta;
        let y = state.calYear;
        if (m < 0) { m = 11; y -= 1; }
        else if (m > 11) { m = 0; y += 1; }
        state.calMonth = m;
        state.calYear = y;
        render();
        return;
      }
      if (action === 'close-day-editor') {
        if (isDaySheetDirty() && !confirm('Discard your changes?')) return;
        closeDayEditor();
        return;
      }
      if (action === 'catchup-done') {
        const dayId = el.getAttribute('data-day-id');
        el.disabled = true; el.textContent = 'Saving…';
        try { await catchUp(dayId); } catch (e) { toast(e.message); }
        return;
      }
      if (action === 'catchup-toggle') {
        state.catchupExpanded = !state.catchupExpanded;
        render();
        return;
      }
      if (action === 'stage-photo') {
        const files = await pickPhotos(MAX_PHOTOS - state.pendingDonePhotos.length);
        if (files.length === 0) return;
        // Preserve typed note/minutes across the re-render
        const note = document.getElementById('done-note')?.value ?? '';
        const mins = document.getElementById('done-mins')?.value ?? '';
        state.pendingDonePhotos = state.pendingDonePhotos.concat(files).slice(0, MAX_PHOTOS);
        render();
        const n = document.getElementById('done-note'); if (n) n.value = note;
        const m = document.getElementById('done-mins'); if (m) m.value = mins;
        return;
      }
      if (action === 'unstage-photo') {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const note = document.getElementById('done-note')?.value ?? '';
        const mins = document.getElementById('done-mins')?.value ?? '';
        state.pendingDonePhotos.splice(idx, 1);
        render();
        const n = document.getElementById('done-note'); if (n) n.value = note;
        const m = document.getElementById('done-mins'); if (m) m.value = mins;
        return;
      }
      if (action === 'add-photo') {
        const completionId = el.getAttribute('data-completion-id');
        const files = await pickPhotos(MAX_PHOTOS - photosFor(completionId).length);
        if (files.length === 0) return;
        el.disabled = true; el.innerHTML = '<span class="ic">⏳</span>…';
        try {
          const n = await uploadPhotos(completionId, files);
          await refreshKeepingSheet();
          toast(`${n} photo${n === 1 ? '' : 's'} added 📷`);
        } catch (e) {
          toast(e.message);
          if (document.body.contains(el)) { el.disabled = false; el.innerHTML = '<span class="ic">📷</span>Add'; }
        }
        return;
      }
      if (action === 'view-photo') {
        const photo = state.recentPhotos.find(p => p.id === el.getAttribute('data-photo-id'));
        if (photo) openLightbox(photo);
        return;
      }
      if (action === 'toggle-done') {
        const day_id = el.getAttribute('data-day-id');
        const name = el.getAttribute('data-name');
        el.disabled = true;
        try { await togglePersonDone(day_id, name); } catch (e) { toast(e.message); }
        if (document.body.contains(el)) el.disabled = false; // re-enable in case togglePersonDone returned early (cancel)
        return;
      }
    };
  });
}

// ============== Release notes (shown once per device per release) ==============
function maybeShowReleaseNotes() {
  let seen = null;
  try { seen = localStorage.getItem(RELEASE_KEY); } catch (e) {}
  if (seen === RELEASE.id) return;
  const wrap = document.createElement('div');
  wrap.className = 'name-picker-wrap';
  wrap.innerHTML = `
    <div class="name-picker">
      <button class="sheet-x" type="button" aria-label="Close">✕</button>
      <h2>What's new</h2>
      <div class="sub">A few updates to Tidy Tolzmanns</div>
      ${RELEASE.items.map(([ic, t, d]) => `
        <div class="release-item">
          <div class="ic">${ic}</div>
          <div><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div></div>
        </div>
      `).join('')}
      <button class="btn btn-primary" type="button" style="margin-top: 6px;">Got it</button>
    </div>
  `;
  const close = () => {
    try { localStorage.setItem(RELEASE_KEY, RELEASE.id); } catch (e) {}
    wrap.remove();
  };
  wrap.querySelector('.sheet-x').onclick = close;
  wrap.querySelector('.btn').onclick = close;
  wrap.addEventListener('click', ev => { if (ev.target === wrap) close(); });
  document.body.appendChild(wrap);
}

// ============== Boot ==============
(async function boot() {
  try {
    await refresh();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty-state">Couldn't reach Supabase: ${esc(e.message)}<br><br><button class="btn btn-secondary" onclick="location.reload()">Retry</button></div>`;
    return;
  }
  subscribeLiveUpdates();
  // Returning users see the release list once; first-run users are busy picking a name.
  if (state.who) maybeShowReleaseNotes();
})();

// Live updates: refresh on any tt_day / tt_completion change.
// Show a notification banner when someone *other than you* completes today's task.
function subscribeLiveUpdates() {
  let refreshTimer = null;
  const scheduleRefresh = () => {
    if (refreshTimer) return;
    refreshTimer = setTimeout(async () => {
      refreshTimer = null;
      try { await refresh(); } catch (e) { /* swallow — next event will retry */ }
    }, 250);
  };
  sb.channel('tt-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tt_completion' }, (payload) => {
      if (payload.eventType === 'INSERT') {
        const row = payload.new;
        // Only notify for someone-else finishing *today's* row (not backfilled past days).
        const isToday = state.today && row && row.day_id === state.today.day.id;
        const isMe = row && row.user_name === state.who;
        if (isToday && !isMe) notifyPersonDone(row.user_name, state.today.day.area);
      }
      scheduleRefresh();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tt_day' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tt_photo' }, scheduleRefresh)
    .subscribe();
}

// Re-check the day every 5 minutes in case someone leaves the app open across midnight
setInterval(() => {
  const newDate = todayCT();
  if (newDate !== state.todayDate) refresh();
}, 5 * 60 * 1000);
</script>
